<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Corredor 3D - Revolução Francesa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #e5e9f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none; /* Evita comportamentos padrão de scroll no celular */
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Interface de Instruções Sobreposta */
    #ui {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      width: 90%;
      max-width: 400px;
    }

    #ui h1 {
      font-size: 1.1rem;
      color: #8b0000;
      font-family: 'Georgia', serif;
      margin-bottom: 3px;
    }

    #ui p {
      font-size: 0.75rem;
      color: #4a4a4a;
    }
  </style>
  <!-- Biblioteca Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <h1>Revolução Francesa 3D</h1>
    <p>📱 Arraste para Cima/Baixo para andar | Arraste para os Lados para olhar</p>
  </div>

  <div id="canvas-container"></div>

  <script>
    // ----------------------------------------------------
    // 1. DADOS DOS CARTAZES (CONTEÚDO DAS PAREDES)
    // ----------------------------------------------------
    const tópicos = [
      {
        num: "1",
        titulo: "Crises do Século XVIII",
        data: "Pré-1789",
        lado: "esquerda",
        texto: [
          "• Sociedade Estamental: 3 Estados.",
          "• Crise econômica e agrícola grave.",
          "• Enfraquecimento do Absolutismo."
        ]
      },
      {
        num: "2",
        titulo: "Estados Gerais",
        data: "Maio 1789",
        lado: "direita",
        texto: [
          "• Convocação por Luís XVI.",
          "• Impasse no sistema de votação.",
          "• Terceiro Estado exige voto por cabeça."
        ]
      },
      {
        num: "3",
        titulo: "Assembleia Constitucional",
        data: "1789-1791",
        lado: "esquerda",
        texto: [
          "• Queda da Bastilha (14/07/1789).",
          "• Fim dos privilégios feudais.",
          "• Declaração dos Direitos do Homem."
        ]
      },
      {
        num: "4",
        titulo: "Jacobinos e Girondinos",
        data: "1791+",
        lado: "direita",
        texto: [
          "• Girondinos: Moderados (Alta Burguesia).",
          "• Jacobinos: Radicais (Sans-culottes).",
          "• Conflitos pelo rumo da Revolução."
        ]
      },
      {
        num: "5",
        titulo: "República Jacobina",
        data: "1792-1794",
        lado: "esquerda",
        texto: [
          "• Execução do rei Luís XVI.",
          "• Fase do Terror (Robespierre).",
          "• Lei do Preço Máximo e Fim da Escravidão."
        ]
      },
      {
        num: "6",
        titulo: "O Diretório",
        data: "1795-1799",
        lado: "direita",
        texto: [
          "• Reação Termidoriana (Girondinos).",
          "• Período de forte instabilidade.",
          "• Golpe do 18 de Brumário."
        ]
      },
      {
        num: "7",
        titulo: "Consulado Napoleônico",
        data: "1799-1804",
        lado: "esquerda",
        texto: [
          "• Napoleão assume como 1º Cônsul.",
          "• Criação do Banco da França.",
          "• Código Civil Napoleônico (1804)."
        ]
      },
      {
        num: "8",
        titulo: "Império Napoleônico",
        data: "1804-1815",
        lado: "direita",
        texto: [
          "• Napoleão coroado Imperador.",
          "• Decreto do Bloqueio Continental.",
          "• Derrota em Waterloo e Congr. de Viena."
        ]
      }
    ];

    // ----------------------------------------------------
    // 2. CONFIGURAÇÃO DA CENA 3D (THREE.JS)
    // ----------------------------------------------------
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f3f8);
    scene.fog = new THREE.Fog(0xf0f3f8, 10, 50); // Névoa suave ao fundo

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    
    // Posição inicial da câmera (Primeira Pessoa)
    let camZ = 0;
    let camYaw = 0; // Rotação Horizontal (Olhar para os lados)
    
    camera.position.set(0, 1.6, camZ); // Altura de 1.6m (olhos)

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // ----------------------------------------------------
    // 3. ILUMINAÇÃO DO CORREDOR
    // ----------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.5);
    dirLight.position.set(0, 4, 0);
    scene.add(dirLight);

    // Lâmpadas ao longo do corredor
    const totalDistancia = tópicos.length * 6 + 10;
    for (let z = 0; z > -totalDistancia; z -= 8) {
      const light = new THREE.PointLight(0xffeedd, 0.8, 8);
      light.position.set(0, 3.2, z);
      scene.add(light);
    }

    // ----------------------------------------------------
    // 4. CONSTRUÇÃO DO CORREDOR (PAREDES, CHÃO, TETO)
    // ----------------------------------------------------
    const larguraCorredor = 4;
    const alturaCorredor = 3.5;
    const comprimentoCorredor = totalDistancia + 5;

    // Textura/Material do Chão
    const floorGeo = new THREE.PlaneGeometry(larguraCorredor, comprimentoCorredor);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xd0d7de, roughness: 0.4 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -comprimentoCorredor / 2 + 2);
    scene.add(floor);

    // Parede Esquerda
    const wallLeftGeo = new THREE.PlaneGeometry(comprimentoCorredor, alturaCorredor);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xfbfeff, roughness: 0.8 });
    const wallLeft = new THREE.Mesh(wallLeftGeo, wallMat);
    wallLeft.rotation.y = Math.PI / 2;
    wallLeft.position.set(-larguraCorredor / 2, alturaCorredor / 2, -comprimentoCorredor / 2 + 2);
    scene.add(wallLeft);

    // Parede Direita
    const wallRight = new THREE.Mesh(wallLeftGeo, wallMat);
    wallRight.rotation.y = -Math.PI / 2;
    wallRight.position.set(larguraCorredor / 2, alturaCorredor / 2, -comprimentoCorredor / 2 + 2);
    scene.add(wallRight);

    // Teto
    const ceilingGeo = new THREE.PlaneGeometry(larguraCorredor, comprimentoCorredor);
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0 });
    const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, alturaCorredor, -comprimentoCorredor / 2 + 2);
    scene.add(ceiling);

    // Parede de Fundo (Fim do Corredor)
    const backWallGeo = new THREE.PlaneGeometry(larguraCorredor, alturaCorredor);
    const backWall = new THREE.Mesh(backWallGeo, wallMat);
    backWall.position.set(0, alturaCorredor / 2, -comprimentoCorredor + 2);
    scene.add(backWall);

    // ----------------------------------------------------
    // 5. CRIAÇÃO DINÂMICA DOS CARTAZES NAS PAREDES
    // ----------------------------------------------------
    function criarTexturaCartaz(item) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 700;
      const ctx = canvas.getContext('2d');

      // Fundo do Cartaz
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Borda do Cartaz
      ctx.strokeStyle = '#8b0000';
      ctx.lineWidth = 16;
      ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);

      // Topo (Badge)
      ctx.fillStyle = '#8b0000';
      ctx.fillRect(20, 20, canvas.width - 40, 70);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px Georgia';
      ctx.textAlign = 'center';
      ctx.fillText(`TÓPICO ${item.num} - ${item.data}`, canvas.width / 2, 65);

      // Título
      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 32px Georgia';
      ctx.fillText(item.titulo, canvas.width / 2, 140);

      // Linha Divisória
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(50, 160);
      ctx.lineTo(canvas.width - 50, 160);
      ctx.stroke();

      // Texto/Bullet Points
      ctx.fillStyle = '#333333';
      ctx.font = '24px Arial';
      ctx.textAlign = 'left';

      let startY = 220;
      item.texto.forEach(linha => {
        // Quebra automática de linha simples no canvas
        const palavras = linha.split(' ');
        let linhaAtual = '';
        for (let n = 0; n < palavras.length; n++) {
          let testLinha = linhaAtual + palavras[n] + ' ';
          let metrics = ctx.measureText(testLinha);
          if (metrics.width > canvas.width - 80 && n > 0) {
            ctx.fillText(linhaAtual, 40, startY);
            linhaAtual = palavras[n] + ' ';
            startY += 35;
          } else {
            linhaAtual = testLinha;
          }
        }
        ctx.fillText(linhaAtual, 40, startY);
        startY += 55;
      });

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    // Adiciona os cartazes ao longo do corredor
    tópicos.forEach((item, index) => {
      const zPos = -(index * 6 + 4); // Espaçamento de 6 metros entre cartazes
      const posterGeo = new THREE.PlaneGeometry(1.6, 2.2);
      const posterMat = new THREE.MeshBasicMaterial({
        map: criarTexturaCartaz(item),
        side: THREE.DoubleSide
      });
      const poster = new THREE.Mesh(posterGeo, posterMat);

      if (item.lado === 'esquerda') {
        poster.position.set(-larguraCorredor / 2 + 0.02, 1.7, zPos);
        poster.rotation.y = Math.PI / 2;
      } else {
        poster.position.set(larguraCorredor / 2 - 0.02, 1.7, zPos);
        poster.rotation.y = -Math.PI / 2;
      }

      scene.add(poster);
    });

    // ----------------------------------------------------
    // 6. CONTROLES DE NAVEGAÇÃO PARA CELULAR E MOUSE
    // ----------------------------------------------------
    let touchStartX = 0;
    let touchStartY = 0;

    // Sensibilidade dos controles
    const speed = 0.008;
    const rotationSpeed = 0.005;

    // Limites de deslocamento no corredor
    const maxZ = 1;
    const minZ = -comprimentoCorredor + 3;

    // Suporte para Toque no Celular
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    window.addEventListener('touchmove', (e) => {
      const touchX = e.touches[0].clientX;
      const touchY = e.touches[0].clientY;

      const deltaX = touchX - touchStartX;
      const deltaY = touchY - touchStartY;

      // Arrastar para Cima/Baixo = Mover para Frente/Trás
      camZ += deltaY * speed;
      camZ = Math.max(minZ, Math.min(maxZ, camZ)); // Aplica limites

      // Arrastar para os Lados = Olhar Esquerda/Direita
      camYaw += deltaX * rotationSpeed;
      // Limita o ângulo para não girar o pescoço 360° desnecessariamente (-90° a +90°)
      camYaw = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camYaw));

      touchStartX = touchX;
      touchStartY = touchY;
    });

    // Suporte para Scroll do Mouse (Desktop)
    window.addEventListener('wheel', (e) => {
      camZ -= e.deltaY * 0.005;
      camZ = Math.max(minZ, Math.min(maxZ, camZ));
    });

    // Suporte para Mover o Mouse (Olhar para os lados no Desktop)
    let isMouseDown = false;
    let mouseX = 0;

    window.addEventListener('mousedown', (e) => { isMouseDown = true; mouseX = e.clientX; });
    window.addEventListener('mouseup', () => { isMouseDown = false; });
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const deltaX = e.clientX - mouseX;
      camYaw += deltaX * rotationSpeed;
      camYaw = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camYaw));
      mouseX = e.clientX;
    });

    // Redimensionamento de Tela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ----------------------------------------------------
    // 7. LOOP DE RENDERIZAÇÃO
    // ----------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      // Atualiza posição Z da câmera com interpolação suave
      camera.position.z += (camZ - camera.position.z) * 0.1;

      // Atualiza a rotação de olhar para os lados
      camera.rotation.y = camYaw;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
