<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Museu da Revolução Francesa 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Georgia', serif;
      touch-action: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Topo com Título */
    #ui-header {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 12, 10, 0.85);
      border: 1px solid #d4af37;
      padding: 8px 20px;
      border-radius: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      width: 85%;
      max-width: 380px;
    }

    #ui-header h1 {
      font-size: 1.1rem;
      color: #d4af37;
      letter-spacing: 1px;
    }

    #ui-header p {
      font-size: 0.7rem;
      color: #ccc;
      font-family: sans-serif;
    }

    /* Controles de Navegação (Setas na Tela) */
    .nav-controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 20;
    }

    .nav-btn {
      width: 65px;
      height: 65px;
      background: rgba(20, 15, 10, 0.85);
      border: 2px solid #d4af37;
      border-radius: 50%;
      color: #d4af37;
      font-size: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, background 0.2s;
    }

    .nav-btn:active {
      transform: scale(0.9);
      background: #d4af37;
      color: #000;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-header">
    <h1>Museu da Revolução Francesa</h1>
    <p>Use as setas para andar • Arraste na tela para olhar</p>
  </div>

  <!-- Botões de Controle na Parte Inferior -->
  <div class="nav-controls">
    <div class="nav-btn" id="btn-back">▼</div>
    <div class="nav-btn" id="btn-fwd">▲</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // ----------------------------------------------------
    // 1. DADOS DOS QUADROS HISTÓRICOS
    // ----------------------------------------------------
    const obras = [
      {
        num: "I",
        titulo: "Crises do Século XVIII",
        data: "Pré-1789",
        lado: "esquerda",
        texto: [
          "• Divisão em Três Estados.",
          "• Grave crise financeira e agrícola.",
          "• Difusão dos ideais Iluministas."
        ]
      },
      {
        num: "II",
        titulo: "Estados Gerais",
        data: "Maio 1789",
        lado: "direita",
        texto: [
          "• Convocação por Luís XVI.",
          "• Impasse no sistema de votação.",
          "• Terceiro Estado exige voto por cabeça."
        ]
      },
      {
        num: "III",
        titulo: "Assembleia Constitucional",
        data: "1789-1791",
        lado: "esquerda",
        texto: [
          "• Queda da Bastilha (14 de Julho).",
          "• Fim dos privilégios feudais.",
          "• Direitos do Homem e do Cidadão."
        ]
      },
      {
        num: "IV",
        titulo: "Jacobinos e Girondinos",
        data: "1791+",
        lado: "direita",
        texto: [
          "• Girondinos: Moderados (Alta Burguesia).",
          "• Jacobinos: Radicais (Sans-culottes).",
          "• Disputas pelo controle do Estado."
        ]
      },
      {
        num: "V",
        titulo: "República Jacobina",
        data: "1792-1794",
        lado: "esquerda",
        texto: [
          "• Execução do rei Luís XVI.",
          "• Período do Terror (Robespierre).",
          "• Lei do Preço Máximo e Fim da Escravidão."
        ]
      },
      {
        num: "VI",
        titulo: "O Diretório",
        data: "1795-1799",
        lado: "direita",
        texto: [
          "• Retomada pela Alta Burguesia.",
          "• Fase de instabilidade e corrupção.",
          "• Encerramento com o 18 de Brumário."
        ]
      },
      {
        num: "VII",
        titulo: "Consulado Napoleônico",
        data: "1799-1804",
        lado: "esquerda",
        texto: [
          "• Napoleão assume como 1º Cônsul.",
          "• Criação do Banco da França.",
          "• Código Civil Napoleônico (1804)."
        ]
      },
      {
        num: "VIII",
        titulo: "Império Napoleônico",
        data: "1804-1815",
        lado: "direita",
        texto: [
          "• Coroação de Napoleão como Imperador.",
          "• Bloqueio Continental à Inglaterra.",
          "• Queda em Waterloo e Congr. de Viena."
        ]
      }
    ];

    // ----------------------------------------------------
    // 2. CENA E CÂMERA (PRIMEIRA PESSOA)
    // ----------------------------------------------------
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0806);
    scene.fog = new THREE.FogExp2(0x0a0806, 0.03); // Névoa intimista de museu

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    
    let camZ = 0;
    let camYaw = 0;
    let camPitch = 0;
    camera.position.set(0, 1.6, camZ);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // ----------------------------------------------------
    // 3. TEXTURAS PROCEDURAIS (TAPETE VERMELHO & MADEIRA)
    // ----------------------------------------------------
    // Tapete Vermelho Ornamentado
    function gerarTexturaTapete() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Fundo Vinho/Vermelho Escuro
      ctx.fillStyle = '#66000e';
      ctx.fillRect(0, 0, 512, 512);

      // Bordas Douradas Trabalhadas
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 12;
      ctx.strokeRect(10, 10, 492, 492);
      ctx.lineWidth = 4;
      ctx.strokeRect(25, 25, 462, 462);

      // Padronagem Clássica
      ctx.fillStyle = '#800014';
      for(let x = 40; x < 512; x += 60) {
        for(let y = 40; y < 512; y += 60) {
          ctx.beginPath();
          ctx.arc(x, y, 12, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    // ----------------------------------------------------
    // 4. ESTRUTURA DO MUSEU (PAREDES, TAPETE, TETO)
    // ----------------------------------------------------
    const larguraCorredor = 4.5;
    const alturaCorredor = 4.0;
    const totalDistancia = obras.length * 6.5 + 8;

    // Chão com Tapete
    const floorGeo = new THREE.PlaneGeometry(larguraCorredor, totalDistancia);
    const tapeteTex = gerarTexturaTapete();
    tapeteTex.repeat.set(2, totalDistancia / 3);
    const floorMat = new THREE.MeshStandardMaterial({ map: tapeteTex, roughness: 0.6 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -totalDistancia / 2 + 2);
    scene.add(floor);

    // Paredes de Museu (Tom Escuro Elegante)
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1f1915, roughness: 0.9 });
    const wallGeo = new THREE.PlaneGeometry(totalDistancia, alturaCorredor);

    // Parede Esquerda
    const wallLeft = new THREE.Mesh(wallGeo, wallMat);
    wallLeft.rotation.y = Math.PI / 2;
    wallLeft.position.set(-larguraCorredor / 2, alturaCorredor / 2, -totalDistancia / 2 + 2);
    scene.add(wallLeft);

    // Parede Direita
    const wallRight = new THREE.Mesh(wallGeo, wallMat);
    wallRight.rotation.y = -Math.PI / 2;
    wallRight.position.set(larguraCorredor / 2, alturaCorredor / 2, -totalDistancia / 2 + 2);
    scene.add(wallRight);

    // Rodapé de Madeira nas Paredes
    const rodapeGeo = new THREE.BoxGeometry(0.1, 0.3, totalDistancia);
    const rodapeMat = new THREE.MeshStandardMaterial({ color: 0x2b1810, roughness: 0.4 });
    const rodapeEsq = new THREE.Mesh(rodapeGeo, rodapeMat);
    rodapeEsq.position.set(-larguraCorredor/2 + 0.05, 0.15, -totalDistancia / 2 + 2);
    scene.add(rodapeEsq);

    const rodapeDir = new THREE.Mesh(rodapeGeo, rodapeMat);
    rodapeDir.position.set(larguraCorredor/2 - 0.05, 0.15, -totalDistancia / 2 + 2);
    scene.add(rodapeDir);

    // Teto
    const ceilingGeo = new THREE.PlaneGeometry(larguraCorredor, totalDistancia);
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x0f0d0b });
    const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, alturaCorredor, -totalDistancia / 2 + 2);
    scene.add(ceiling);

    // ----------------------------------------------------
    // 5. ILUMINAÇÃO DE MUSEU (LUZ AMBIENTE BAIXA + SPOTS)
    // ----------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0xfff8ed, 0.25); // Luz geral tênue
    scene.add(ambientLight);

    // ----------------------------------------------------
    // 6. TELA/TELAS DAS OBRAS + MOLDURAS DOURADAS
    // ----------------------------------------------------
    function criarTexturaTela(item) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 700;
      const ctx = canvas.getContext('2d');

      // Fundo Papel Antigo/Pergaminho
      ctx.fillStyle = '#f8f4e6';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Moldura Interna Delicada
      ctx.strokeStyle = '#8b0000';
      ctx.lineWidth = 6;
      ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);

      // Título da Obra
      ctx.fillStyle = '#8b0000';
      ctx.font = 'bold 26px Georgia';
      ctx.textAlign = 'center';
      ctx.fillText(`SALA ${item.num}`, canvas.width / 2, 60);

      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 30px Georgia';
      ctx.fillText(item.titulo, canvas.width / 2, 110);

      ctx.fillStyle = '#d4af37';
      ctx.font = 'italic 20px Georgia';
      ctx.fillText(`— ${item.data} —`, canvas.width / 2, 140);

      // Linha Separadora
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(60, 160);
      ctx.lineTo(canvas.width - 60, 160);
      ctx.stroke();

      // Conteúdo Explicativo
      ctx.fillStyle = '#2b2b2b';
      ctx.font = '22px Georgia';
      ctx.textAlign = 'left';

      let startY = 220;
      item.texto.forEach(linha => {
        const palavras = linha.split(' ');
        let linhaAtual = '';
        for (let n = 0; n < palavras.length; n++) {
          let testLinha = linhaAtual + palavras[n] + ' ';
          let metrics = ctx.measureText(testLinha);
          if (metrics.width > canvas.width - 90 && n > 0) {
            ctx.fillText(linhaAtual, 45, startY);
            linhaAtual = palavras[n] + ' ';
            startY += 32;
          } else {
            linhaAtual = testLinha;
          }
        }
        ctx.fillText(linhaAtual, 45, startY);
        startY += 55;
      });

      return new THREE.CanvasTexture(canvas);
    }

    // Geometria da Moldura Dourada Trabalhada
    const molduraMat = new THREE.MeshStandardMaterial({
      color: 0xd4af37,
      metalness: 0.85,
      roughness: 0.25
    });

    obras.forEach((item, index) => {
      const zPos = -(index * 6.5 + 4);
      const grupoQuadro = new THREE.Group();

      // Tela
      const canvasGeo = new THREE.PlaneGeometry(1.5, 2.1);
      const canvasMat = new THREE.MeshBasicMaterial({ map: criarTexturaTela(item) });
      const telaMesh = new THREE.Mesh(canvasGeo, canvasMat);
      telaMesh.position.z = 0.04;
      grupoQuadro.add(telaMesh);

      // Moldura Dourada Ornamentada (Estrutura Externa)
      const frameOuter = new THREE.Mesh(new THREE.BoxGeometry(1.75, 2.35, 0.08), molduraMat);
      grupoQuadro.add(frameOuter);

      const frameInner = new THREE.Mesh(new THREE.BoxGeometry(1.58, 2.18, 0.09), new THREE.MeshStandardMaterial({ color: 0x4a3710, roughness: 0.5 }));
      grupoQuadro.add(frameInner);

      // Posicionamento e Inclinação Leve (Angulados para leitura)
      const anguloInclinacao = Math.PI / 7; // ~25 graus em direção ao visitante

      if (item.lado === 'esquerda') {
        grupoQuadro.position.set(-larguraCorredor / 2 + 0.35, 1.8, zPos);
        grupoQuadro.rotation.y = Math.PI / 2 - anguloInclinacao; // Inclinado para frente
      } else {
        grupoQuadro.position.set(larguraCorredor / 2 - 0.35, 1.8, zPos);
        grupoQuadro.rotation.y = -Math.PI / 2 + anguloInclinacao; // Inclinado para frente
      }

      scene.add(grupoQuadro);

      // Spot Light Exclusivo Direcionado para o Quadro (Luz de Museu)
      const spotLight = new THREE.SpotLight(0xfff2a3, 3.5);
      spotLight.angle = Math.PI / 6;
      spotLight.penumbra = 0.4;
      spotLight.decay = 2;
      spotLight.distance = 7;

      // Posição da lâmpada no teto
      const posX = item.lado === 'esquerda' ? -1.2 : 1.2;
      spotLight.position.set(posX, alturaCorredor - 0.2, zPos);
      spotLight.target = telaMesh;

      scene.add(spotLight);
      scene.add(spotLight.target);
    });

    // ----------------------------------------------------
    // 7. CONTROLES (SETAS PARA ANDAR + TOQUE PARA OLHAR)
    // ----------------------------------------------------
    let moveForward = false;
    let moveBackward = false;

    const btnFwd = document.getElementById('btn-fwd');
    const btnBack = document.getElementById('btn-back');

    // Eventos dos Botões de Seta
    const startFwd = (e) => { e.preventDefault(); moveForward = true; };
    const stopFwd = (e) => { e.preventDefault(); moveForward = false; };
    const startBack = (e) => { e.preventDefault(); moveBackward = true; };
    const stopBack = (e) => { e.preventDefault(); moveBackward = false; };

    btnFwd.addEventListener('touchstart', startFwd);
    btnFwd.addEventListener('touchend', stopFwd);
    btnFwd.addEventListener('mousedown', startFwd);
    btnFwd.addEventListener('mouseup', stopFwd);

    btnBack.addEventListener('touchstart', startBack);
    btnBack.addEventListener('touchend', stopBack);
    btnBack.addEventListener('mousedown', startBack);
    btnBack.addEventListener('mouseup', stopBack);

    // Olhar em 360° Arrastando o Dedo na Tela Livremente
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.target.classList.contains('nav-btn')) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.target.classList.contains('nav-btn')) return;

      const deltaX = e.touches[0].clientX - touchStartX;
      const deltaY = e.touches[0].clientY - touchStartY;

      camYaw += deltaX * 0.005;
      camPitch += deltaY * 0.003;

      // Limite para olhar para cima/baixo
      camPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, camPitch));

      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    // Olhar com o Mouse no PC
    let isMouseDown = false;
    let mouseX = 0, mouseY = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('nav-btn')) return;
      isMouseDown = true;
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => isMouseDown = false);
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const deltaX = e.clientX - mouseX;
      const deltaY = e.clientY - mouseY;

      camYaw += deltaX * 0.004;
      camPitch += deltaY * 0.003;
      camPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, camPitch));

      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // Suporte a Teclas WSAD / Setas do Teclado
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') moveForward = true;
      if (e.key === 'ArrowDown' || e.key === 's') moveBackward = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') moveForward = false;
      if (e.key === 'ArrowDown' || e.key === 's') moveBackward = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ----------------------------------------------------
    // 8. LOOP DE ANIMAÇÃO E RENDERIZAÇÃO
    // ----------------------------------------------------
    const walkSpeed = 0.08;
    const maxZ = 1;
    const minZ = -totalDistancia + 4;

    function animate() {
      requestAnimationFrame(animate);

      // Movimentação pelas Setas
      if (moveForward) {
        camZ -= walkSpeed;
      }
      if (moveBackward) {
        camZ += walkSpeed;
      }

      camZ = Math.max(minZ, Math.min(maxZ, camZ));

      // Suavização do movimento Z da Câmera
      camera.position.z += (camZ - camera.position.z) * 0.1;

      // Aplicação da rotação da visão (Olhar para os lados e cima/baixo)
      camera.rotation.order = "YXZ";
      camera.rotation.y = camYaw;
      camera.rotation.x = camPitch;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
