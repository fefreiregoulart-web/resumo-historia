<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Museu da Revolução Francesa 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050505; font-family: 'Georgia', serif; touch-action: none; }
    #canvas-container { width: 100%; height: 100%; display: block; }
    
    #ui-header {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 12, 10, 0.95); border: 1px solid #d4af37;
      padding: 8px 20px; border-radius: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      text-align: center; pointer-events: none; z-index: 10; width: 85%; max-width: 400px;
    }
    #ui-header h1 { font-size: 1.1rem; color: #d4af37; letter-spacing: 1px; }
    #ui-header p { font-size: 0.75rem; color: #ccc; font-family: sans-serif; }

    .nav-controls {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 20px; z-index: 20;
    }
    .nav-btn {
      width: 65px; height: 65px; background: rgba(20, 15, 10, 0.95);
      border: 2px solid #d4af37; border-radius: 50%; color: #d4af37;
      font-size: 1.8rem; display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.7); user-select: none;
      -webkit-tap-highlight-color: transparent; transition: transform 0.1s, background 0.2s;
    }
    .nav-btn:active { transform: scale(0.9); background: #d4af37; color: #000; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-header">
    <h1>Museu da Revolução Francesa</h1>
    <p>Use as setas para andar • Arraste na tela para olhar</p>
  </div>

  <div class="nav-controls">
    <div class="nav-btn" id="btn-back">▼</div>
    <div class="nav-btn" id="btn-fwd">▲</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // ----------------------------------------------------
    // 1. DADOS COMPLETOS DO RESUMO (8 TÓPICOS)
    // ----------------------------------------------------
    const obras = [
      {
        num: "I",
        titulo: "Crises do Século XVIII",
        data: "Pré-1789",
        lado: "esquerda",
        ilustracao: "bandeira",
        texto: [
          "• Sociedade Estamental: Clero (1º), Nobreza (2º) e Terceiro Estado (Burguesia e camponeses).",
          "• Crise Econômica: Gastos da corte, guerras e colheitas ruins (fome e inflação).",
          "• Crise Política: Absolutismo enfraquecido e influência Iluminista."
        ]
      },
      {
        num: "II",
        titulo: "Estados Gerais",
        data: "Maio 1789",
        lado: "direita",
        ilustracao: "assembleia",
        texto: [
          "• Convocados por Luís XVI para crise financeira.",
          "• Impasse: 1º e 2º queriam voto por Estado; 3º Estado exigia voto por cabeça.",
          "• 3º Estado se declara Assembleia Nacional Constitucional."
        ]
      },
      {
        num: "III",
        titulo: "Assembleia Constitucional",
        data: "1789-1791",
        lado: "esquerda",
        ilustracao: "bastilha",
        texto: [
          "• Queda da Bastilha em 14 de Julho de 1789.",
          "• Fim dos privilégios feudais da nobreza.",
          "• Aprovação da Declaração dos Direitos do Homem e do Cidadão."
        ]
      },
      {
        num: "IV",
        titulo: "Jacobinos e Girondinos",
        data: "1791+",
        lado: "direita",
        ilustracao: "balanca",
        texto: [
          "• Girondinos: Alta burguesia, moderados, sentavam-se à direita.",
          "• Jacobinos: Baixa burguesia e sans-culottes, radicais, sentavam-se à esquerda."
        ]
      },
      {
        num: "V",
        titulo: "República Jacobina",
        data: "1792-1794",
        lado: "esquerda",
        ilustracao: "guilhotina",
        texto: [
          "• Proclamação da República e execução do rei Luís XVI.",
          "• Fase do Terror (Robespierre): execuções de opositores.",
          "• Preço Máximo, ensino gratuito e fim da escravidão colonial."
        ]
      },
      {
        num: "VI",
        titulo: "O Diretório",
        data: "1795-1799",
        lado: "direita",
        ilustracao: "escudo",
        texto: [
          "• Reação Termidoriana: Alta burguesia retoma o poder e derruba Robespierre.",
          "• Período de instabilidade política e corrupção.",
          "• Encerra-se com o Golpe do 18 de Brumário por Napoleão."
        ]
      },
      {
        num: "VII",
        titulo: "Consulado Napoleônico",
        data: "1799-1804",
        lado: "esquerda",
        ilustracao: "livro",
        texto: [
          "• Centralização do poder em Napoleão (Primeiro-Cônsul).",
          "• Reorganização financeira: criação do Banco da França.",
          "• Código Civil Napoleônico (1804): igualdade jurídica e propriedade privada."
        ]
      },
      {
        num: "VIII",
        titulo: "Império Napoleônico",
        data: "1804-1815",
        lado: "direita",
        ilustracao: "corona",
        texto: [
          "• Coroação como Imperador e expansão militar na Europa.",
          "• Bloqueio Continental (1806) contra a Inglaterra.",
          "• Derrota na Rússia (1812), Waterloo (1815) e Congresso de Viena."
        ]
      }
    ];

    // ----------------------------------------------------
    // 2. CONFIGURAÇÃO DA CENA THREE.JS
    // ----------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0806);
    scene.fog = new THREE.FogExp2(0x0a0806, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    let camZ = 0, camYaw = 0, camPitch = 0;
    camera.position.set(0, 1.6, camZ);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // ----------------------------------------------------
    // 3. ESTRUTURA DO CORREDOR / MUSEU
    // ----------------------------------------------------
    const larguraCorredor = 4.8;
    const alturaCorredor = 4.2;
    const totalDistancia = obras.length * 6.5 + 8;

    // Tapete
    function gerarTapete() {
      const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#6d000f'; ctx.fillRect(0,0,256,256);
      ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 10; ctx.strokeRect(5,5,246,246);
      const t = new THREE.CanvasTexture(cv);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(2, totalDistancia / 3);
      return t;
    }

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(larguraCorredor, totalDistancia),
      new THREE.MeshStandardMaterial({ map: gerarTapete(), roughness: 0.5 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -totalDistancia / 2 + 2);
    scene.add(floor);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1f1915, roughness: 0.8 });
    const wallGeo = new THREE.PlaneGeometry(totalDistancia, alturaCorredor);

    const wallLeft = new THREE.Mesh(wallGeo, wallMat);
    wallLeft.rotation.y = Math.PI / 2;
    wallLeft.position.set(-larguraCorredor / 2, alturaCorredor / 2, -totalDistancia / 2 + 2);
    scene.add(wallLeft);

    const wallRight = new THREE.Mesh(wallGeo, wallMat);
    wallRight.rotation.y = -Math.PI / 2;
    wallRight.position.set(larguraCorredor / 2, alturaCorredor / 2, -totalDistancia / 2 + 2);
    scene.add(wallRight);

    const ceiling = new THREE.Mesh(
      new THREE.PlaneGeometry(larguraCorredor, totalDistancia),
      new THREE.MeshStandardMaterial({ color: 0x0a0908 })
    );
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, alturaCorredor, -totalDistancia / 2 + 2);
    scene.add(ceiling);

    scene.add(new THREE.AmbientLight(0xffeedd, 0.5));

    // ----------------------------------------------------
    // 4. DESENHO PROCEDURAL DA TELA DO QUADRO (TEXTO + ILUSTRAÇÃO)
    // ----------------------------------------------------
    function desenharIlustracao(ctx, tipo) {
      ctx.save();
      ctx.translate(300, 140);
      
      if (tipo === 'bandeira') {
        ctx.fillStyle = '#002395'; ctx.fillRect(-120, -70, 80, 140);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-40, -70, 80, 140);
        ctx.fillStyle = '#ed2939'; ctx.fillRect(40, -70, 80, 140);
        ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 4; ctx.strokeRect(-120, -70, 240, 140);
      } else if (tipo === 'guilhotina') {
        ctx.fillStyle = '#4a2e18'; ctx.fillRect(-60, -80, 15, 160); ctx.fillRect(45, -80, 15, 160);
        ctx.fillRect(-70, -80, 140, 15); ctx.fillRect(-70, 50, 140, 15);
        ctx.fillStyle = '#cccccc'; ctx.beginPath(); ctx.moveTo(-45, -50); ctx.lineTo(45, -20); ctx.lineTo(45, -50); ctx.closePath(); ctx.fill();
      } else {
        // Símbolo Histórico Geral (Brasão)
        ctx.fillStyle = '#8b0000'; ctx.beginPath(); ctx.arc(0, 0, 65, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 6; ctx.stroke();
        ctx.fillStyle = '#d4af37'; ctx.font = 'bold 50px Georgia'; ctx.textAlign = 'center'; ctx.fillText('RF', 0, 18);
      }
      ctx.restore();
    }

    function gerarTexturaTotal(item) {
      const cv = document.createElement('canvas');
      cv.width = 600; cv.height = 900;
      const ctx = cv.getContext('2d');

      // Fundo Pergaminho
      ctx.fillStyle = '#f8f4e6'; ctx.fillRect(0, 0, 600, 900);
      ctx.strokeStyle = '#8b0000'; ctx.lineWidth = 10; ctx.strokeRect(15, 15, 570, 870);
      ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 4; ctx.strokeRect(25, 25, 550, 850);

      // Ilustração Superior
      desenharIlustracao(ctx, item.ilustracao);

      // Cabeçalho / Título
      ctx.fillStyle = '#8b0000'; ctx.font = 'bold 30px Georgia'; ctx.textAlign = 'center';
      ctx.fillText(`${item.num}. ${item.titulo}`, 300, 270);

      ctx.fillStyle = '#b8860b'; ctx.font = 'italic 22px Georgia';
      ctx.fillText(`— ${item.data} —`, 300, 305);

      ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(60, 325); ctx.lineTo(540, 325); ctx.stroke();

      // Texto em Bullet Points
      ctx.fillStyle = '#111111'; ctx.font = '24px Georgia'; ctx.textAlign = 'left';

      let startY = 370;
      item.texto.forEach(linha => {
        const palavras = linha.split(' ');
        let linhaAtual = '';
        for (let n = 0; n < palavras.length; n++) {
          let testLinha = linhaAtual + palavras[n] + ' ';
          let metrics = ctx.measureText(testLinha);
          if (metrics.width > 480 && n > 0) {
            ctx.fillText(linhaAtual, 60, startY);
            linhaAtual = palavras[n] + ' ';
            startY += 36;
          } else {
            linhaAtual = testLinha;
          }
        }
        ctx.fillText(linhaAtual, 60, startY);
        startY += 58;
      });

      return new THREE.CanvasTexture(cv);
    }

    // ----------------------------------------------------
    // 5. CRIAÇÃO DOS QUADROS E SPOTS DE LUZ
    // ----------------------------------------------------
    const molduraMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 });

    obras.forEach((item, index) => {
      const zPos = -(index * 6.5 + 4);
      const grupoQuadro = new THREE.Group();

      // Tela Frontal
      const canvasMat = new THREE.MeshBasicMaterial({ map: gerarTexturaTotal(item) });
      const telaMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.4), canvasMat);
      telaMesh.position.z = 0.05;
      grupoQuadro.add(telaMesh);

      // Moldura Dourada em Volta
      const frameOuter = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.6, 0.08), molduraMat);
      grupoQuadro.add(frameOuter);

      // Inclinação para visualização confortável (~30°)
      const anguloGiro = Math.PI / 6;

      if (item.lado === 'esquerda') {
        grupoQuadro.position.set(-larguraCorredor / 2 + 0.6, 1.8, zPos);
        grupoQuadro.rotation.y = Math.PI / 2 - anguloGiro;
      } else {
        grupoQuadro.position.set(larguraCorredor / 2 - 0.6, 1.8, zPos);
        grupoQuadro.rotation.y = -Math.PI / 2 + anguloGiro;
      }

      scene.add(grupoQuadro);

      // Spot Light Iluminando o Quadro
      const spotLight = new THREE.SpotLight(0xfff3d1, 3.5);
      spotLight.angle = Math.PI / 4;
      spotLight.penumbra = 0.3;
      spotLight.distance = 8;
      spotLight.position.set(item.lado === 'esquerda' ? -1.0 : 1.0, alturaCorredor - 0.2, zPos);
      spotLight.target = telaMesh;

      scene.add(spotLight);
      scene.add(spotLight.target);
    });

    // ----------------------------------------------------
    // 6. CONTROLES E NAVEGAÇÃO
    // ----------------------------------------------------
    let moveForward = false, moveBackward = false;

    const btnFwd = document.getElementById('btn-fwd');
    const btnBack = document.getElementById('btn-back');

    const startFwd = (e) => { e.preventDefault(); moveForward = true; };
    const stopFwd = (e) => { e.preventDefault(); moveForward = false; };
    const startBack = (e) => { e.preventDefault(); moveBackward = true; };
    const stopBack = (e) => { e.preventDefault(); moveBackward = false; };

    btnFwd.addEventListener('touchstart', startFwd); btnFwd.addEventListener('touchend', stopFwd);
    btnFwd.addEventListener('mousedown', startFwd); btnFwd.addEventListener('mouseup', stopFwd);

    btnBack.addEventListener('touchstart', startBack); btnBack.addEventListener('touchend', stopBack);
    btnBack.addEventListener('mousedown', startBack); btnBack.addEventListener('mouseup', stopBack);

    // Olhar em Volta arrastando o dedo
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.target.classList.contains('nav-btn')) return;
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.target.classList.contains('nav-btn')) return;
      camYaw += (e.touches[0].clientX - touchStartX) * 0.005;
      camPitch += (e.touches[0].clientY - touchStartY) * 0.003;
      camPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, camPitch));
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
    });

    // Olhar com o Mouse no Desktop
    let isMouseDown = false, mouseX = 0, mouseY = 0;
    window.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('nav-btn')) return;
      isMouseDown = true; mouseX = e.clientX; mouseY = e.clientY;
    });
    window.addEventListener('mouseup', () => isMouseDown = false);
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      camYaw += (e.clientX - mouseX) * 0.004;
      camPitch += (e.clientY - mouseY) * 0.003;
      camPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, camPitch));
      mouseX = e.clientX; mouseY = e.clientY;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ----------------------------------------------------
    // 7. LOOP DE RENDERIZAÇÃO
    // ----------------------------------------------------
    const walkSpeed = 0.09;
    const maxZ = 1;
    const minZ = -totalDistancia + 4;

    function animate() {
      requestAnimationFrame(animate);

      if (moveForward) camZ -= walkSpeed;
      if (moveBackward) camZ += walkSpeed;

      camZ = Math.max(minZ, Math.min(maxZ, camZ));
      camera.position.z += (camZ - camera.position.z) * 0.1;

      camera.rotation.order = "YXZ";
      camera.rotation.y = camYaw;
      camera.rotation.x = camPitch;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
