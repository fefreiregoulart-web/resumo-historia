<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Museu 3D - Roteiro de Estudos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
    #canvas-container { width: 100%; height: 100%; display: block; }
    
    #ui-header {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.9); border: 2px solid #d4af37;
      padding: 15px 30px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,1);
      text-align: center; pointer-events: none; z-index: 10; width: 90%; max-width: 500px;
    }
    #ui-header h1 { font-size: 1.2rem; color: #d4af37; text-transform: uppercase; margin-bottom: 5px; }
    #ui-header p { font-size: 0.85rem; color: #fff; }

    .nav-controls {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 30px; z-index: 20;
    }
    .nav-btn {
      width: 75px; height: 75px; background: rgba(30, 30, 30, 0.9);
      border: 3px solid #d4af37; border-radius: 50%; color: #d4af37;
      font-size: 2rem; display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.9); user-select: none;
    }
    .nav-btn:active { transform: scale(0.9); background: #d4af37; color: #000; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-header">
    <h1>Prova de História: Revolução Francesa</h1>
    <p>Ande com as setas para ler seu roteiro de estudos</p>
  </div>

  <div class="nav-controls">
    <div class="nav-btn" id="btn-back">▼</div>
    <div class="nav-btn" id="btn-fwd">▲</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // ==========================================
    // 1. O SEU TEXTO EXATO DIVIDIDO NOS QUADROS
    // ==========================================
    const conteudos = [
      {
        titulo: "1. Crises do Século XVIII (Causas)",
        lado: "esquerda",
        topicos: [
          "• Sociedade Estamental: Divisão em Três Estados. O 1º (Clero) e o 2º (Nobreza) tinham privilégios e isenção fiscal. O 3º Estado (Burguesia, camponeses e trabalhadores urbanos) sustentava o Estado com impostos.",
          "• Crise Econômica: Gastos excessivos da corte, custos de guerras (Sete Anos e Independência dos EUA) e secas/péssimas colheitas que geraram fome e inflação.",
          "• Crise Política: Absolutismo enfraquecido e influenciado pelas ideias iluministas de liberdade e igualdade."
        ]
      },
      {
        titulo: "2. Assembleia dos Estados Gerais",
        lado: "direita",
        topicos: [
          "• Estados Gerais: Convocados em 1789 para resolver a crise financeira. Impasse sobre a votação: o 1º e 2º Estados queriam voto por ordem (estado), enquanto o 3º Estado exigia voto por cabeça.",
          "• Assembleia Nacional Constitucional: O Terceiro Estado se declara Assembleia e promete criar uma Constituição.",
          "• Acontecimentos: Queda da Bastilha (14/07/1789), fim dos privilégios feudais e aprovação da Declaração dos Direitos do Homem."
        ]
      },
      {
        titulo: "3. Jacobinos e Girondinos",
        lado: "esquerda",
        topicos: [
          "• Girondinos: Representavam a alta burguesia; moderados e defensores de transformações políticas sem grandes mudanças sociais radicais. Situavam-se à direita.",
          "• Jacobinos: Representavam a baixa/média burguesia e as camadas populares (com apoio dos sans-culottes); radicais e defensores de profundas transformações sociais. Situavam-se à esquerda."
        ]
      },
      {
        titulo: "4. República Jacobina (1792-1794)",
        lado: "direita",
        topicos: [
          "• Proclamação da República e execução de Luís XVI na guilhotina.",
          "• Fase do Terror: Liderada por Robespierre. Perseguição e execução sistemática dos opositores da Revolução pela guilhotina.",
          "• Medidas Populares: Lei do Preço Máximo (congelamento de preços), reforma agrária, criação do ensino gratuito e abolição da escravidão nas colônias."
        ]
      },
      {
        titulo: "5. Diretório (1794-1799)",
        lado: "esquerda",
        topicos: [
          "• Reação Termidoriana: A alta burguesia retoma o poder, derruba Robespierre e consolida o controle moderado.",
          "• Período marcado por forte instabilidade política, crise econômica persistente e corrupção.",
          "• Encerra-se com o Golpe do 18 de Brumário, liderado por Napoleão Bonaparte com apoio da burguesia e do exército."
        ]
      },
      {
        titulo: "6. Era Napoleônica: Consulado",
        lado: "direita",
        topicos: [
          "• Período: 1799 a 1804.",
          "• Transformações Políticas: Centralização do poder nas mãos de Napoleão como Primeiro-Cônsul; reorganização administrativa e financeira (criação do Banco da França).",
          "• Código Civil Napoleônico (1804): Garantia da propriedade privada, igualdade jurídica dos cidadãos do sexo masculino e proibição de greves."
        ]
      },
      {
        titulo: "7. Era Napoleônica: Império",
        lado: "esquerda",
        topicos: [
          "• Período: 1804 a 1815.",
          "• Cenário Geopolítico: Expansão militar francesa pela Europa e enfraquecimento das monarquias absolutistas vizinhas.",
          "• Bloqueio Continental (1806): Proibição aos países europeus de comerciar com a Inglaterra para enfraquecê-la economicamente.",
          "• Declínio: Fracasso da invasão da Rússia (1812), derrota na Batalha de Waterloo (1815) e a reorganização do mapa europeu pelo Congresso de Viena."
        ]
      }
    ];

    // ==========================================
    // 2. CONFIGURAÇÃO DA CENA (CLARA E VISÍVEL)
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1512); // Fundo escuro mas não preto absoluto
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    let camZ = 0, camYaw = 0, camPitch = 0;
    camera.position.set(0, 1.6, camZ); // Câmera na altura dos olhos

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    // Configurações de cores corretas para textos não ficarem escuros
    renderer.outputEncoding = THREE.sRGBEncoding; 
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // ==========================================
    // 3. CONSTRUÇÃO DO CORREDOR
    // ==========================================
    const largura = 6.0; // Corredor mais largo para os quadros ficarem confortáveis
    const altura = 4.0;
    const distTotal = conteudos.length * 7.5 + 8;

    // Chão cinza chumbo
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(largura, distTotal),
      new THREE.MeshBasicMaterial({ color: 0x222222 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -distTotal / 2 + 2);
    scene.add(floor);

    // Paredes e teto
    const wallMat = new THREE.MeshBasicMaterial({ color: 0x110d0a }); // Marrom super escuro
    const wallL = new THREE.Mesh(new THREE.PlaneGeometry(distTotal, altura), wallMat);
    wallL.rotation.y = Math.PI / 2;
    wallL.position.set(-largura / 2, altura / 2, -distTotal / 2 + 2);
    scene.add(wallL);

    const wallR = new THREE.Mesh(new THREE.PlaneGeometry(distTotal, altura), wallMat);
    wallR.rotation.y = -Math.PI / 2;
    wallR.position.set(largura / 2, altura / 2, -distTotal / 2 + 2);
    scene.add(wallR);

    // Linha guia dourada no chão para orientar o caminho
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(0.2, distTotal),
      new THREE.MeshBasicMaterial({ color: 0x8b0000 })
    );
    line.rotation.x = -Math.PI / 2;
    line.position.set(0, 0.01, -distTotal / 2 + 2);
    scene.add(line);

    // ==========================================
    // 4. FUNÇÃO PARA DESENHAR O TEXTO COM QUEBRA DE LINHA
    // ==========================================
    function criarTexturaLegivel(item) {
      const cv = document.createElement('canvas');
      cv.width = 1200; // Resolução gigante para ficar nítido
      cv.height = 1400; 
      const ctx = cv.getContext('2d');

      // Fundo Branco Claro (Garante o contraste máximo)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cv.width, cv.height);

      // Bordas Douradas e Vermelhas
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 20;
      ctx.strokeRect(10, 10, cv.width - 20, cv.height - 20);
      ctx.strokeStyle = '#8b0000';
      ctx.lineWidth = 8;
      ctx.strokeRect(35, 35, cv.width - 70, cv.height - 70);

      // Título do Quadro
      ctx.fillStyle = '#8b0000';
      ctx.font = 'bold 55px Arial';
      ctx.textAlign = 'center';
      
      // Quebrar título se for muito grande
      if (item.titulo.length > 35) {
        ctx.fillText(item.titulo.substring(0, 30) + '...', cv.width / 2, 120);
        ctx.fillText(item.titulo.substring(30), cv.width / 2, 180);
      } else {
        ctx.fillText(item.titulo, cv.width / 2, 140);
      }

      ctx.fillStyle = '#d4af37';
      ctx.fillRect(200, 220, 800, 6); // Linha divisória

      // Desenhar Tópicos com Quebra de Linha
      ctx.fillStyle = '#000000'; // Texto totalmente preto para leitura fácil
      ctx.font = 'bold 38px Arial';
      ctx.textAlign = 'left';

      let startY = 320;
      const margemEsquerda = 80;
      const larguraMaxima = cv.width - 160;

      item.topicos.forEach(texto => {
        const palavras = texto.split(' ');
        let linhaAtual = '';
        
        for (let n = 0; n < palavras.length; n++) {
          let teste = linhaAtual + palavras[n] + ' ';
          let larguraTeste = ctx.measureText(teste).width;
          
          if (larguraTeste > larguraMaxima && n > 0) {
            ctx.fillText(linhaAtual, margemEsquerda, startY);
            linhaAtual = palavras[n] + ' ';
            startY += 55; // Espaço entre as linhas
          } else {
            linhaAtual = teste;
          }
        }
        ctx.fillText(linhaAtual, margemEsquerda, startY);
        startY += 90; // Espaço maior entre os parágrafos
      });

      const tex = new THREE.CanvasTexture(cv);
      tex.encoding = THREE.sRGBEncoding; // IMPORTANTE: mantém a cor branca pura!
      tex.minFilter = THREE.LinearFilter; // Melhora a nitidez
      return tex;
    }

    // ==========================================
    // 5. MONTAGEM DOS QUADROS VIRADOS PARA VOCÊ
    // ==========================================
    const molduraMat = new THREE.MeshBasicMaterial({ color: 0xd4af37 }); // Moldura Dourada que brilha

    conteudos.forEach((item, index) => {
      const zPos = -(index * 7.5 + 5);
      const quadro = new THREE.Group();

      // O Canvas com o texto
      // MeshBasicMaterial IGNORA a escuridão do ambiente. Sempre vai ser visível!
      const telaMat = new THREE.MeshBasicMaterial({ map: criarTexturaLegivel(item) });
      const telaMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.8), telaMat);
      telaMesh.position.z = 0.06;
      quadro.add(telaMesh);

      // Moldura externa
      const frameOuter = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.0, 0.1), molduraMat);
      quadro.add(frameOuter);

      // ÂNGULO AGRESSIVO PARA FRENTE (VIRADOS PARA VOCÊ)
      // Math.PI / 4 = 45 graus. Eles ficarão praticamente de frente pra câmera.
      const angulo = Math.PI / 4.5; 

      if (item.lado === 'esquerda') {
        quadro.position.set(-largura / 2 + 1.2, 1.8, zPos);
        quadro.rotation.y = Math.PI / 2 - angulo; // Vira da parede para o centro
      } else {
        quadro.position.set(largura / 2 - 1.2, 1.8, zPos);
        quadro.rotation.y = -Math.PI / 2 + angulo; // Vira da parede para o centro
      }

      scene.add(quadro);
    });

    // ==========================================
    // 6. CONTROLES E MOVIMENTO
    // ==========================================
    let moveForward = false, moveBackward = false;

    const btnFwd = document.getElementById('btn-fwd');
    const btnBack = document.getElementById('btn-back');

    const toggleFwd = (v) => (e) => { e.preventDefault(); moveForward = v; };
    const toggleBack = (v) => (e) => { e.preventDefault(); moveBackward = v; };

    btnFwd.addEventListener('touchstart', toggleFwd(true)); btnFwd.addEventListener('touchend', toggleFwd(false));
    btnFwd.addEventListener('mousedown', toggleFwd(true)); btnFwd.addEventListener('mouseup', toggleFwd(false));

    btnBack.addEventListener('touchstart', toggleBack(true)); btnBack.addEventListener('touchend', toggleBack(false));
    btnBack.addEventListener('mousedown', toggleBack(true)); btnBack.addEventListener('mouseup', toggleBack(false));

    // Permitir olhar de leve para os lados
    let touchStartX = 0, touchStartY = 0;
    
    window.addEventListener('touchstart', (e) => {
      if (e.target.classList.contains('nav-btn')) return;
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.target.classList.contains('nav-btn')) return;
      camYaw += (e.touches[0].clientX - touchStartX) * 0.005;
      camPitch += (e.touches[0].clientY - touchStartY) * 0.003;
      // Limitar o quanto pode olhar para não se perder
      camYaw = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, camYaw)); 
      camPitch = Math.max(-Math.PI / 6, Math.min(Math.PI / 6, camPitch));
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
    });

    // Responsividade
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 7. LOOP DE RENDERIZAÇÃO
    // ==========================================
    const walkSpeed = 0.12;
    const maxZ = 2;
    const minZ = -distTotal + 5;

    function animate() {
      requestAnimationFrame(animate);

      if (moveForward) camZ -= walkSpeed;
      if (moveBackward) camZ += walkSpeed;

      camZ = Math.max(minZ, Math.min(maxZ, camZ));
      camera.position.z += (camZ - camera.position.z) * 0.15; // Interpolação suave

      camera.rotation.order = "YXZ";
      camera.rotation.y = camYaw;
      camera.rotation.x = camPitch;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
