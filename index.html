<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Museu da Revolução Francesa 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Georgia', serif;
      touch-action: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    #ui-header {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 12, 10, 0.9);
      border: 1px solid #d4af37;
      padding: 8px 20px;
      border-radius: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      width: 85%;
      max-width: 400px;
    }

    #ui-header h1 {
      font-size: 1.1rem;
      color: #d4af37;
      letter-spacing: 1px;
    }

    #ui-header p {
      font-size: 0.7rem;
      color: #ccc;
      font-family: sans-serif;
    }

    .nav-controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 20;
    }

    .nav-btn {
      width: 65px;
      height: 65px;
      background: rgba(20, 15, 10, 0.9);
      border: 2px solid #d4af37;
      border-radius: 50%;
      color: #d4af37;
      font-size: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, background 0.2s;
    }

    .nav-btn:active {
      transform: scale(0.9);
      background: #d4af37;
      color: #000;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-header">
    <h1>Museu da Revolução Francesa</h1>
    <p>Use as setas para andar • Arraste na tela para olhar</p>
  </div>

  <div class="nav-controls">
    <div class="nav-btn" id="btn-back">▼</div>
    <div class="nav-btn" id="btn-fwd">▲</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // ----------------------------------------------------
    // 1. DADOS DOS QUADROS E OBRAS FAMOSAS
    // ----------------------------------------------------
    const obras = [
      {
        num: "I",
        titulo: "Crises do Século XVIII",
        data: "Pré-1789",
        lado: "esquerda",
        imgUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/MAM_Paris_Oath_of_the_Tennis_Court_Jacques-Louis_David.jpg/640px-MAM_Paris_Oath_of_the_Tennis_Court_Jacques-Louis_David.jpg",
        texto: [
          "• Sociedade Estamental em 3 Estados.",
          "• Crise financeira, dívidas e fome.",
          "• Difusão dos ideais Iluministas."
        ]
      },
      {
        num: "II",
        titulo: "Estados Gerais",
        data: "Maio 1789",
        lado: "direita",
        imgUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Estatesgeneral.jpg/640px-Estatesgeneral.jpg",
        texto: [
          "• Convocação pelo Rei Luís XVI.",
          "• Impasse no sistema de votação.",
          "• Terceiro Estado exige voto individual."
        ]
      },
      {
        num: "III",
        titulo: "Assembleia Constitucional",
        data: "1789-1791",
        lado: "esquerda",
        imgUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Prise_de_la_Bastille.jpg/640px-Prise_de_la_Bastille.jpg",
        texto: [
          "• Queda da Bastilha (14 de Julho).",
          "• Fim dos privilégios feudais.",
          "• Direitos do Homem e do Cidadão."
        ]
      },
      {
        num: "IV",
        titulo: "Jacobinos e Girondinos",
        data: "1791+",
        lado: "direita",
        imgUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Death_of_Marat_by_David.jpg/640px-Death_of_Marat_by_David.jpg",
        texto: [
          "• Girondinos: Moderados (Alta Burguesia).",
          "• Jacobinos: Radicais (Sans-culottes).",
          "• Disputas intensas pelo poder."
        ]
      },
      {
        num: "V",
        titulo: "República Jacobina",
        data: "1792-1794",
        lado: "esquerda",
        imgUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Eug%C3%A8ne_Delacroix_-_Le_28_Juillet._La_Libert%C3%A9_guidant_le_peuple.jpg/640px-Eug%C3%A8ne_Delacroix_-_Le_28_Juillet._La_Libert%C3%A9_guidant_le_peuple.jpg",
        texto: [
          "• Execução do Rei Luís XVI.",
          "• Fase do Terror com Robespierre.",
          "• Lei do Preço Máximo e Fim da Escravidão."
        ]
      },
      {
        num: "VI",
        titulo: "O Diretório",
        data: "1795-1799",
        lado: "direita",
        imgUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Execution_of_Louis_XVI_1793_Neumann.jpg/640px-Execution_of_Louis_XVI_1793_Neumann.jpg",
        texto: [
          "• Retomada pela Alta Burguesia.",
          "• Período de forte instabilidade.",
          "• Encerramento no Golpe 18 de Brumário."
        ]
      },
      {
        num: "VII",
        titulo: "Consulado Napoleônico",
        data: "1799-1804",
        lado: "esquerda",
        imgUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/David_-_Napoleon_crossing_the_Alps_-_Malmaison2.jpg/640px-David_-_Napoleon_crossing_the_Alps_-_Malmaison2.jpg",
        texto: [
          "• Napoleão assume como 1º Cônsul.",
          "• Reorganização financeira e Banco.",
          "• Código Civil Napoleônico (1804)."
        ]
      },
      {
        num: "VIII",
        titulo: "Império Napoleônico",
        data: "1804-1815",
        lado: "direita",
        imgUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Jacques-Louis_David_-_The_Coronation_of_Napoleon_%281805-1807%29.jpg/640px-Jacques-Louis_David_-_The_Coronation_of_Napoleon_%281805-1807%29.jpg",
        texto: [
          "• Coroação de Napoleão como Imperador.",
          "• Bloqueio Continental contra a Inglaterra.",
          "• Queda em Waterloo e Congr. de Viena."
        ]
      }
    ];

    // ----------------------------------------------------
    // 2. CONFIGURAÇÃO DA CENA E CÂMERA
    // ----------------------------------------------------
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080605);
    scene.fog = new THREE.FogExp2(0x080605, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    let camZ = 0;
    let camYaw = 0;
    let camPitch = 0;
    camera.position.set(0, 1.6, camZ);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // ----------------------------------------------------
    // 3. ESTRUTURA DO MUSEU
    // ----------------------------------------------------
    const larguraCorredor = 4.8;
    const alturaCorredor = 4.0;
    const totalDistancia = obras.length * 6.5 + 8;

    // Tapete Vermelho
    function gerarTapete() {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#6d000f'; ctx.fillRect(0,0,256,256);
      ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 10; ctx.strokeRect(5,5,246,246);
      const t = new THREE.CanvasTexture(cv);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(2, totalDistancia / 3);
      return t;
    }

    const floorGeo = new THREE.PlaneGeometry(larguraCorredor, totalDistancia);
    const floorMat = new THREE.MeshStandardMaterial({ map: gerarTapete(), roughness: 0.5 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -totalDistancia / 2 + 2);
    scene.add(floor);

    // Paredes
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1c1714, roughness: 0.8 });
    const wallGeo = new THREE.PlaneGeometry(totalDistancia, alturaCorredor);

    const wallLeft = new THREE.Mesh(wallGeo, wallMat);
    wallLeft.rotation.y = Math.PI / 2;
    wallLeft.position.set(-larguraCorredor / 2, alturaCorredor / 2, -totalDistancia / 2 + 2);
    scene.add(wallLeft);

    const wallRight = new THREE.Mesh(wallGeo, wallMat);
    wallRight.rotation.y = -Math.PI / 2;
    wallRight.position.set(larguraCorredor / 2, alturaCorredor / 2, -totalDistancia / 2 + 2);
    scene.add(wallRight);

    // Teto
    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(larguraCorredor, totalDistancia), new THREE.MeshStandardMaterial({ color: 0x0a0908 }));
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, alturaCorredor, -totalDistancia / 2 + 2);
    scene.add(ceiling);

    // Luz Ambiente Tênue
    const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.4);
    scene.add(ambientLight);

    // ----------------------------------------------------
    // 4. MONTAGEM DAS TELAS DOS QUADROS COM IMAGENS E TEXTO
    // ----------------------------------------------------
    function criarTexturaQuadro(item, imgElement) {
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 900;
      const ctx = canvas.getContext('2d');

      // Fundo Pergaminho/Papel Nobre
      ctx.fillStyle = '#f7f3e8';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Borda Interna Dourada
      ctx.strokeStyle = '#c5a028';
      ctx.lineWidth = 8;
      ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);

      // Desenhar Imagem da Pintura Histórica
      if (imgElement) {
        ctx.drawImage(imgElement, 30, 30, 540, 320);
        ctx.strokeStyle = '#8b0000';
        ctx.lineWidth = 4;
        ctx.strokeRect(28, 28, 544, 324);
      }

      // Título e Fase Histórica
      ctx.fillStyle = '#8b0000';
      ctx.font = 'bold 30px Georgia';
      ctx.textAlign = 'center';
      ctx.fillText(`FASE ${item.num}: ${item.titulo.toUpperCase()}`, canvas.width / 2, 400);

      ctx.fillStyle = '#b8860b';
      ctx.font = 'italic 22px Georgia';
      ctx.fillText(`— ${item.data} —`, canvas.width / 2, 435);

      // Linha Separadora
      ctx.strokeStyle = '#c5a028';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(60, 455);
      ctx.lineTo(canvas.width - 60, 455);
      ctx.stroke();

      // Bullet Points do Texto Explicativo
      ctx.fillStyle = '#1a1a1a';
      ctx.font = '26px Georgia';
      ctx.textAlign = 'left';

      let startY = 510;
      item.texto.forEach(linha => {
        const palavras = linha.split(' ');
        let linhaAtual = '';
        for (let n = 0; n < palavras.length; n++) {
          let testLinha = linhaAtual + palavras[n] + ' ';
          let metrics = ctx.measureText(testLinha);
          if (metrics.width > canvas.width - 100 && n > 0) {
            ctx.fillText(linhaAtual, 50, startY);
            linhaAtual = palavras[n] + ' ';
            startY += 38;
          } else {
            linhaAtual = testLinha;
          }
        }
        ctx.fillText(linhaAtual, 50, startY);
        startY += 65;
      });

      return new THREE.CanvasTexture(canvas);
    }

    const molduraMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 });

    obras.forEach((item, index) => {
      const zPos = -(index * 6.5 + 4);
      const grupoQuadro = new THREE.Group();

      // Carregar a Imagem e desenhar na textura do quadro
      const img = new Image();
      img.crossOrigin = "Anonymous";
      img.src = item.imgUrl;

      const canvasGeo = new THREE.PlaneGeometry(1.6, 2.4);
      const canvasMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const telaMesh = new THREE.Mesh(canvasGeo, canvasMat);
      telaMesh.position.z = 0.05;

      img.onload = () => {
        telaMesh.material.map = criarTexturaQuadro(item, img);
        telaMesh.material.needsUpdate = true;
      };

      // Se a imagem falhar por rede, carrega só o texto
      img.onerror = () => {
        telaMesh.material.map = criarTexturaQuadro(item, null);
        telaMesh.material.needsUpdate = true;
      };

      grupoQuadro.add(telaMesh);

      // Moldura Dourada
      const frameOuter = new THREE.Mesh(new THREE.BoxGeometry(1.85, 2.65, 0.08), molduraMat);
      grupoQuadro.add(frameOuter);

      // Posição e Ângulo (Virados para o Centro do Corredor para leitura)
      const anguloGiro = Math.PI / 6; // 30 graus virado para o visitante

      if (item.lado === 'esquerda') {
        grupoQuadro.position.set(-larguraCorredor / 2 + 0.6, 1.8, zPos);
        grupoQuadro.rotation.y = Math.PI / 2 - anguloGiro;
      } else {
        grupoQuadro.position.set(larguraCorredor / 2 - 0.6, 1.8, zPos);
        grupoQuadro.rotation.y = -Math.PI / 2 + anguloGiro;
      }

      scene.add(grupoQuadro);

      // Spot de Luz Iluminando o Quadro
      const spotLight = new THREE.SpotLight(0xfff3d1, 3.0);
      spotLight.angle = Math.PI / 5;
      spotLight.penumbra = 0.3;
      spotLight.distance = 8;

      const posX = item.lado === 'esquerda' ? -1.0 : 1.0;
      spotLight.position.set(posX, alturaCorredor - 0.2, zPos);
      spotLight.target = telaMesh;

      scene.add(spotLight);
      scene.add(spotLight.target);
    });

    // ----------------------------------------------------
    // 5. CONTROLES DE NAVEGAÇÃO
    // ----------------------------------------------------
    let moveForward = false;
    let moveBackward = false;

    const btnFwd = document.getElementById('btn-fwd');
    const btnBack = document.getElementById('btn-back');

    const startFwd = (e) => { e.preventDefault(); moveForward = true; };
    const stopFwd = (e) => { e.preventDefault(); moveForward = false; };
    const startBack = (e) => { e.preventDefault(); moveBackward = true; };
    const stopBack = (e) => { e.preventDefault(); moveBackward = false; };

    btnFwd.addEventListener('touchstart', startFwd);
    btnFwd.addEventListener('touchend', stopFwd);
    btnFwd.addEventListener('mousedown', startFwd);
    btnFwd.addEventListener('mouseup', stopFwd);

    btnBack.addEventListener('touchstart', startBack);
    btnBack.addEventListener('touchend', stopBack);
    btnBack.addEventListener('mousedown', startBack);
    btnBack.addEventListener('mouseup', stopBack);

    // Arrastar a Tela para Girar a Câmera
    let touchStartX = 0, touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.target.classList.contains('nav-btn')) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.target.classList.contains('nav-btn')) return;
      const deltaX = e.touches[0].clientX - touchStartX;
      const deltaY = e.touches[0].clientY - touchStartY;

      camYaw += deltaX * 0.005;
      camPitch += deltaY * 0.003;
      camPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, camPitch));

      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    // Mouse no PC
    let isMouseDown = false, mouseX = 0, mouseY = 0;
    window.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('nav-btn')) return;
      isMouseDown = true; mouseX = e.clientX; mouseY = e.clientY;
    });
    window.addEventListener('mouseup', () => isMouseDown = false);
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      camYaw += (e.clientX - mouseX) * 0.004;
      camPitch += (e.clientY - mouseY) * 0.003;
      camPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, camPitch));
      mouseX = e.clientX; mouseY = e.clientY;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ----------------------------------------------------
    // 6. LOOP DE RENDERIZAÇÃO
    // ----------------------------------------------------
    const walkSpeed = 0.09;
    const maxZ = 1;
    const minZ = -totalDistancia + 4;

    function animate() {
      requestAnimationFrame(animate);

      if (moveForward) camZ -= walkSpeed;
      if (moveBackward) camZ += walkSpeed;

      camZ = Math.max(minZ, Math.min(maxZ, camZ));

      camera.position.z += (camZ - camera.position.z) * 0.1;

      camera.rotation.order = "YXZ";
      camera.rotation.y = camYaw;
      camera.rotation.x = camPitch;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
